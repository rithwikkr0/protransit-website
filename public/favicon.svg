<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E164D"/>
      <stop offset="50%" stop-color="#070B28"/>
      <stop offset="100%" stop-color="#040618"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" stroke="#00BCD4" stroke-opacity="0.35" stroke-width="4"/>

  <!-- P Contour -->
  <path d="M140 140 H 280 C 330 140 370 180 370 230 C 370 280 330 320 280 320 H 220" 
        stroke="url(#cyanGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M140 140 V 380" 
        stroke="url(#cyanGlow)" stroke-width="26" stroke-linecap="round"/>

  <!-- T Contour -->
  <path d="M260 140 H 400" 
        stroke="url(#mintGlow)" stroke-width="24" stroke-linecap="round"/>
  <path d="M330 140 V 380 C 330 400 315 410 295 410 H 230" 
        stroke="url(#mintGlow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Transit Rail Track Curve -->
  <path d="M120 420 C 160 380 230 330 300 230" 
        stroke="#00E5FF" stroke-width="16" stroke-linecap="round" stroke-dasharray="24 16"/>

  <!-- Glowing Hub Node Center -->
  <circle cx="300" cy="230" r="32" fill="#070B28" stroke="#00E5FF" stroke-width="10" filter="url(#glow)"/>
  <circle cx="300" cy="230" r="14" fill="#00E5FF"/>
  <circle cx="300" cy="230" r="6" fill="#FFFFFF"/>

  <!-- Orbit nodes -->
  <circle cx="270" cy="210" r="5" fill="#00E676"/>
  <circle cx="330" cy="210" r="5" fill="#00E676"/>
  <circle cx="300" cy="265" r="5" fill="#00E676"/>
</svg>
